/* Layout: a cash ledger — fixed header with today's cash, one scrolling column (two on tablets), bottom tab bar */
:root{

  --accent:#0D6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4E9E3;
  --good:#1E7A3D; --good-soft:#DDF0E2; --warn:#9A5B06; --warn-soft:#FBEED6; --bad:#B42318; --bad-soft:#FADFDB;
  --paid:#B8F7CB; --paid-ink:#0A5226; --paid-glow:rgb(30 200 95/.5);
  --due:#FFD3CC; --due-hot:#FFA597; --due-ink:#8E170D; --due-glow:rgb(235 45 30/.55);
  --chart-muted:#B7C3BE; --chart-good:#3FA563;
  --font:"Plex",system-ui,"Noto Sans Arabic",Tahoma,sans-serif; --display:"Kufi","Plex",system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#29352F;
  --accent:#4EC0AC; --accent-ink:#06231D; --accent-soft:#16352E;
  --good:#5BC27E; --good-soft:#15301E; --warn:#E3A94A; --warn-soft:#33270F; --bad:#F07A6C; --bad-soft:#3A1915;
  --paid:#1C6B3A; --paid-ink:#D2FFE0; --paid-glow:rgb(60 230 120/.45);
  --due:#6E1F17; --due-hot:#A12A1D; --due-ink:#FFE0DA; --due-glow:rgb(255 90 70/.55);
  --chart-muted:#43514B; --chart-good:#4FBF76; color-scheme:dark}}

.chip.fund{background:var(--good);color:#fff}
.chip.done{background:var(--good-soft);color:var(--good)} .chip.late,.chip.short{background:var(--bad-soft);color:var(--bad)} .chip.moved{background:var(--warn-soft);color:var(--warn)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}

.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.icon{min-width:42px;padding:0;display:inline-grid;place-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.thick{height:12px}
.bar.good i{background:var(--good)}
.debt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}

.debt .bar,.debt .meta,.debt .btns{grid-column:1/-1}
.debt .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.prio{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows .prio:first-child{border-top:0}
.prio .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.prio .n.personal{background:var(--accent);color:var(--accent-ink)}
.prio .n.goal{background:var(--good-soft);color:var(--good)}
.prio .n.off{background:var(--sunk);color:var(--muted)}
.month{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.month>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.month>summary::-webkit-details-marker{display:none}
.month>summary h2{font-size:16px}
.month .sumline{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.month .body{padding:4px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.month.cur{border-color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;font-size:12.5px;margin-top:10px}

.note.bad{background:var(--bad-soft);color:var(--bad)} .note.good{background:var(--good-soft);color:var(--good)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.info{background:var(--accent-soft);color:var(--accent)}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}

.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.tablewrap{overflow-x:auto;margin:0 -4px}

.tabs-in{display:flex;width:100%;max-width:640px}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}

<header class="top"><div class="top-in"><h1>دفتر السداد</h1><a class="bell" href="#alerts" aria-label="التنبيهات"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span>التنبيهات</span><b id="bellN" hidden>0</b></a><div class="cash"><div><small>نقدك الآن</small><b class="num" id="topCash">0</b></div><div id="topRes" hidden><small>منه بالصندوق والاحتياطي</small><b class="num" id="topResV">0</b></div></div></div></header>
<main id="view"></main>
<nav class="tabs"><div class="tabs-in" id="tabs">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>الرئيسية</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>الخطة</a>
  <a href="#day" data-tab="day"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>اليومية</a>
  <a href="#debts" data-tab="debts"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>الديون</a>
  <a href="#reports" data-tab="reports"><svg viewBox="0 0 24 24"><path d="M5 20V10M10 20V4M15 20v-7M20 20v-4"/></svg>التقارير</a>
</div></nav>

<div id="toast" class="toast" hidden></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>fmtDate(new Date());
const ymOf=s=>s.slice(0,7);
const addM=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)+k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+pad(m)};
const mBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const dateIn=(ym,day)=>ym+"-"+pad(Math.min(Math.max(1,Math.round(+day||1)),dim(ym)));
const mName=ym=>MONTHS[+ym.slice(5,7)-1]+" "+ym.slice(0,4);
const dDay=s=>+s.slice(8,10);
const dLabel=s=>(+s.slice(8,10))+" "+MONTHS[+s.slice(5,7)-1];
const toDate=(s,h=12)=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),h);
const addDays=(s,k)=>{const d=toDate(s);d.setDate(d.getDate()+k);return fmtDate(d)};
const diffDays=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const money=n=>{n=Math.round(+n||0);return (n<0?"-":"")+Math.abs(n).toLocaleString("en-US")};
const shortN=n=>{const a=Math.abs(n),s=n<0?"-":"";return s+(a>=1e4?Math.round(a/1e3)+"k":a>=1e3?(a/1e3).toFixed(1).replace(/\.0$/,"")+"k":Math.round(a))};
const M=n=>'<span class="num">'+money(n)+"</span>";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0};

/* updates for plans saved by an earlier version: saved days, payments and reserves stay */
function migrate(){
  if(!S.v||S.v<4){S.settings=S.settings||{};S.planned=S.planned||[];S.reserves=S.reserves||[];S.closed=S.closed||{}}
  if(S.v<5){

/* every record remembers when it last changed (or was deleted), so two devices that worked apart can be merged without losing either side */
let PREV={};
const recObjs=st=>{const m={};Object.keys(st.entries||{}).forEach(k=>m["e:"+k]=st.entries[k]);(st.payments||[]).forEach(x=>m["p:"+x.id]=x);(st.planned||[]).forEach(x=>m["pl:"+x.id]=x);(st.reserves||[]).forEach(x=>m["r:"+x.id]=x);(st.items||[]).forEach(x=>m["i:"+x.id]=x);return m};
const recIndex=st=>{const o=recObjs(st),m={};Object.keys(o).forEach(k=>m[k]=JSON.stringify(o[k]));return m};
function stampChanges(){
  const now=Date.now(),cur=recIndex(S);S.stamp=S.stamp||{};S.tomb=S.tomb||{};
  Object.keys(cur).forEach(k=>{if(PREV[k]!==cur[k]){S.stamp[k]=now;delete S.tomb[k]}});
  Object.keys(PREV).forEach(k=>{if(!(k in cur)){S.tomb[k]=now;delete S.stamp[k]}});
  PREV=cur}
const canon=o=>o===null||typeof o!=="object"?JSON.stringify(o):Array.isArray(o)?"["+o.map(canon).join(",")+"]":"{"+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}";
function mergeStates(L,R){
  const lu=num(L.updatedAt),ru=num(R.updatedAt),newer=ru>=lu?R:L,older=newer===R?L:R,out=JSON.parse(JSON.stringify(newer));
  const ls=L.stamp||{},rs=R.stamp||{},tomb={};[L.tomb||{},R.tomb||{}].forEach(t=>Object.keys(t).forEach(k=>tomb[k]=Math.max(tomb[k]||0,num(t[k]))));
  const li=recObjs(L),ri=recObjs(R),stamp={},keep={};
  new Set(Object.keys(li).concat(Object.keys(ri))).forEach(k=>{
    const a=li[k],b=ri[k],sa=a?num(ls[k]):-1,sb=b?num(rs[k]):-1;let pick,st;
    if(a&&b){if(sa>sb){pick=a;st=sa}else if(sb>sa){pick=b;st=sb}else{pick=newer===R?b:a;st=sa}}
    else if(a){pick=a;st=sa}else{pick=b;st=sb}
    if(num(tomb[k])>st)return;
    delete tomb[k];keep[k]=pick;if(st>0)stamp[k]=st});
  out.entries={};Object.keys(keep).filter(k=>k.startsWith("e:")).sort().forEach(k=>out.entries[k.slice(2)]=keep[k]);
  const arr=(pre,name)=>{const seen=new Set(),res=[];(newer[name]||[]).concat(older[name]||[]).forEach(x=>{const k=pre+x.id;if(keep[k]&&!seen.has(k)){seen.add(k);res.push(keep[k])}});return res};
  out.payments=arr("p:","payments");out.planned=arr("pl:","planned");out.reserves=arr("r:","reserves");out.items=arr("i:","items");
  const ids=new Set(out.items.filter(i=>i.kind==="debt"||i.kind==="goal").map(i=>i.id));
  out.order=(out.order||[]).filter(id=>ids.has(id));ids.forEach(id=>{if(!out.order.includes(id))out.order.push(id)});
  out.closed=Object.assign({},older.closed||{},newer.closed||{});
  out.stamp=stamp;out.tomb=tomb;out.updatedAt=Math.max(lu,ru);return out}
function persist(){S.updatedAt=Date.now();stampChanges();if(!Store.save(S))toast("ما قدرت أحفظ — جرّب مرة ثانية");queueSync()}

const SYNCKEY="sadad-sync";

const b64e=x=>btoa(unescape(encodeURIComponent(x))),b64d=x=>decodeURIComponent(escape(atob(String(x).replace(/\s/g,""))));
const ghFile=(method,body)=>fetch("https://api.github.com/repos/"+SY.repo+"/contents/data.json"+(method==="GET"?"?t="+Date.now():""),{method,cache:"no-store",headers:{Authorization:"Bearer "+SY.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});

let syncBusy=false,syncT=null;

const syncStatusText=()=>!syncOn()?"غير مفعّلة. بياناتك على هذا الجهاز فقط.":SY.err?"آخر محاولة فشلت: "+SY.err:SY.last?"آخر مزامنة: "+new Date(SY.last).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" · "+fmtDate(new Date(SY.last)):"مفعّلة، بانتظار أول مزامنة";

/* ---------- money in and out ---------- */
const byId=id=>S.items.find(i=>i.id===id);
const isDebt=it=>!!it&&it.kind==="debt";
const isPersonal=it=>isDebt(it)&&it.dtype==="personal";
const isGoal=it=>!!it&&it.kind==="goal";
const inQueue=it=>isGoal(it)||(isDebt(it)&&!isPersonal(it));
const goalLeft=g=>Math.max(0,num(g.target)-paidBy(g.id));
const netOf=e=>num(e.inc)-num(e.fuel)-num(e.food)-num(e.other);
const forYm=p=>p.for||ymOf(p.date);
const livingItem=()=>S.items.find(i=>i.fromDaily);
const livingActive=ym=>{const l=livingItem();return !!l&&billActive(l,ym)};
const foodIn=ym=>sum(Object.keys(S.entries).filter(k=>ymOf(k)===ym),k=>num(S.entries[k].food));
const paidBy=id=>sum(S.payments.filter(p=>p.item===id),p=>num(p.amount));
const paidIn=(id,ym)=>{const it=byId(id);return sum(S.payments.filter(p=>p.item===id&&p.ptype!=="exceptional"&&forYm(p)===ym),p=>num(p.amount))+(it&&it.fromDaily?foodIn(ym):0)};
const curBal=it=>isGoal(it)?goalLeft(it):Math.max(0,num(it.balance)-paidBy(it.id));
const origOf=it=>isGoal(it)?num(it.target):num(it.balance);
const cashNow=()=>num(S.startCash)+sum(Object.values(S.entries),netOf)-sum(S.payments,p=>num(p.amount));
const resOf=p=>sum(S.reserves.filter(r=>(r.purpose||"عام")===p),r=>r.kind==="out"?-num(r.amount):num(r.amount));
const reserveBal=()=>sum(S.reserves,r=>r.kind==="out"?-num(r.amount):num(r.amount));
const fundBal=()=>resOf(FUND);
const keepAmt=()=>num((S.settings.fund||{}).keep);
function reserveByPurpose(){const o={};S.reserves.forEach(r=>{const k=r.purpose||"عام";o[k]=(o[k]||0)+(r.kind==="out"?-1:1)*num(r.amount)});Object.keys(o).forEach(k=>{if(Math.abs(o[k])<0.5)delete o[k]});return o}
const freeCash=()=>cashNow()-reserveBal();
const ovOf=(id,ym)=>S.overrides[id+"|"+ym];
function billActive(b,ym){
  if(b.start&&ym<b.start)return false;
  if(b.end&&ym>b.end)return false;
  if(b.freq==="once")return ym===(b.start||ym);
  if(b.freq==="bimonthly")return mBetween(b.start||ym,ym)%2===0;
  if(b.freq==="yearly")return mBetween(b.start||ym,ym)%12===0;
  return true}
function defaultPlanned(it,ym){
  if(it.kind==="bill")return billActive(it,ym)?num(it.amount):0;
  if(it.start&&ym<it.start)return 0;
  return num(it.amount)}
function plannedFor(it,ym){const o=ovOf(it.id,ym);return o&&o.amount!=null?num(o.amount):defaultPlanned(it,ym)}
const dayFor=(it,ym)=>{const o=ovOf(it.id,ym);return o&&o.day!=null?o.day:it.day};
const nextTarget=()=>S.order.map(byId).find(it=>it&&inQueue(it)&&curBal(it)>0.5)||null;

/* payment history per debt: installment number + balance after each payment */
function payInfo(){
  const info={};
  S.items.filter(isDebt).forEach(it=>{
    let run=num(it.balance),k=0;
    S.payments.map((p,i)=>[p,i]).filter(([p])=>p.item===it.id).sort((a,b)=>a[0].date<b[0].date?-1:a[0].date>b[0].date?1:a[1]-b[1]).forEach(([p])=>{
      run-=num(p.amount);if(p.ptype!=="exceptional")k++;
      info[p.id]={no:p.ptype!=="exceptional"?k:null,balAfter:Math.max(0,run)}})});
  return info}

/* ---------- income: plan = daily average × working days; actual = your logged days ---------- */
const workMeasure=(e,ym)=>num(e.inc)-num(e.fuel)-num(e.other)-(livingActive(ym)?0:num(e.food));
function avgDaily(){
  const keys=Object.keys(S.entries).sort();if(!keys.length)return null;
  const t=todayStr(),end=S.entries[t]?t:addDays(t,-1);
  let from=addDays(end,-29);if(from<keys[0])from=keys[0];
  if(end<from)return null;
  const days=diffDays(from,end)+1,ks=keys.filter(k=>k>=from&&k<=end);
  const nf=sum(ks,k=>{const e=S.entries[k];return num(e.inc)-num(e.fuel)-num(e.other)}),fd=sum(ks,k=>num(S.entries[k].food));
  return{rate:(nf-fd)/days,noFood:nf/days,food:fd/days,days,month:nf/days*30.4}}
const planMonthly=()=>num(S.settings.dailyAvg)*num(S.settings.workdays);
const expectedMonth=ym=>S.settings.incomeByMonth[ym]!=null?num(S.settings.incomeByMonth[ym]):planMonthly();
function useActual(){const a=avgDaily();return S.settings.incomeMode==="actual"&&a&&a.days>=7?a:null}
const rateIncome=(r,ym,days)=>r.noFood*days-(livingActive(ym)?0:r.food*days);
const daysLeftNow=()=>{const t=todayStr();return dim(ymOf(t))-dDay(t)+(S.entries[t]?0:1)};
const monthSpan=ym=>ym===ymOf(S.startDate)?dim(ym)-dDay(S.startDate)+1:dim(ym);
function remainingIncome(r){
  const ym=ymOf(todayStr()),left=daysLeftNow();
  if(r)return Math.max(0,rateIncome(r,ym,left));
  return Math.max(0,expectedMonth(ym)*Math.min(1,left/monthSpan(ym)))}
const incomeFor=(ym,r)=>r?rateIncome(r,ym,dim(ym)):expectedMonth(ym);
const perWorkday=ym=>expectedMonth(ym)/Math.max(1,monthSpan(ym)*num(S.settings.workdays)/dim(ym));
function monthToDate(){
  const t=todayStr(),ym=ymOf(t),span=monthSpan(ym),elapsed=span-daysLeftNow();
  const got=sum(Object.keys(S.entries).filter(k=>ymOf(k)===ym&&k>=S.startDate&&k<=t),k=>workMeasure(S.entries[k],ym));
  return{got,expected:expectedMonth(ym)*Math.max(0,elapsed)/span,elapsed,span}}

/* ---------- the plan: month by month, every payment dated ----------
   o.fund: the snowball — each month's surplus goes into the payoff fund; when the fund (minus what you keep)
   covers the next debt in your order, that debt is closed in one payment and its installment joins the fund. */
const OBL=new Set(["bill","budget","min","full","exc"]);
const FUNDK=new Set(["close","lump","goal"]);
function simulate(o){
  o=o||{};
  const t=todayStr(),cur=ymOf(t),start0=ymOf(S.startDate),F=S.settings.fund||{},keep=num(F.keep),r=o.rate||useActual();
  const queue=S.order.map(byId).filter(it=>it&&inQueue(it));
  const pIdx=id=>{const i=S.order.indexOf(id);return i<0?99:i};
  const bal={},reg={};
  S.items.filter(isDebt).forEach(i=>{bal[i.id]=curBal(i);reg[i.id]=S.payments.filter(p=>p.item===i.id&&p.ptype!=="exceptional").length});
  if(o.fund)S.items.filter(isGoal).forEach(g=>{bal[g.id]=goalLeft(g)});
  const payoff={};Object.keys(bal).forEach(id=>{if(bal[id]<=0.5)payoff[id]="done"});
  const mk=(it,kind,amount,date,fy,extra)=>Object.assign({item:it.id,name:it.name,kind,amount:Math.round(amount*100)/100,date,for:fy,ov:!!ovOf(it.id,fy)},extra||{});
  /* anything from earlier months that was never paid comes forward as overdue */
  const overdue=[];
  for(let ym=start0;ym<cur;ym=addM(ym,1)){
    for(const it of S.items){
      if(it.kind==="bill"){if(it.fromDaily)continue;if(!billActive(it,ym)&&!ovOf(it.id,ym))continue;const rr=plannedFor(it,ym)-paidIn(it.id,ym);if(rr>0.5)overdue.push(mk(it,"bill",rr,dateIn(ym,dayFor(it,ym)),ym))}
      else if(isDebt(it)&&!isPersonal(it)&&bal[it.id]>0.5){const rr=Math.min(bal[it.id],plannedFor(it,ym)-paidIn(it.id,ym));if(rr>0.5)overdue.push(mk(it,"min",rr,dateIn(ym,dayFor(it,ym)),ym))}}}
  const months=[],events=[];let carry=freeCash(),fund=o.fund?fundBal():0;
  const lastPlanned=S.planned.map(p=>ymOf(p.date)).sort().pop()||cur;
  for(let k=0;k<240;k++){
    const ym=addM(cur,k),first=k===0;
    const income=first?remainingIncome(r):incomeFor(ym,r);
    const open=carry,fundOpen=fund;let avail=carry+income;
    const lines=first?overdue.map(x=>({...x})):[];
    for(const it of S.items){
      if(it.kind!=="bill")continue;
      const ov=ovOf(it.id,ym);if(!billActive(it,ym)&&!(ov&&ov.amount))continue;
      const spent=paidIn(it.id,ym),amt=Math.max(0,plannedFor(it,ym)-spent);
      if(it.fromDaily){lines.push(mk(it,"budget",amt,dateIn(ym,31),ym,{spent,budget:plannedFor(it,ym)}));continue}
      if(amt>0.5||(ov&&ov.amount===0&&defaultPlanned(it,ym)>0))lines.push(mk(it,"bill",amt,dateIn(ym,dayFor(it,ym)),ym,{skipped:amt<=0.5}))}
    for(const it of S.items.filter(isDebt)){
      const id=it.id;if(bal[id]<=0.5)continue;
      if(isPersonal(it)){const dueYm=ymOf(it.due||dateIn(cur,28));if(dueYm===ym||(first&&dueYm<cur))lines.push(mk(it,"full",bal[id],it.due,dueYm));continue}
      const ov=ovOf(id,ym),amt=Math.min(bal[id],Math.max(0,plannedFor(it,ym)-paidIn(id,ym)));
      if(amt>0.5||(ov&&ov.amount===0&&defaultPlanned(it,ym)>0))lines.push(mk(it,"min",amt,dateIn(ym,dayFor(it,ym)),ym,{skipped:amt<=0.5}))}
    S.planned.forEach(p=>{const it=byId(p.item);if(!it||bal[it.id]<=0.5)return;const pm=ymOf(p.date);if(pm===ym||(first&&pm<cur))lines.push(mk(it,"exc",Math.min(num(p.amount),bal[it.id]),p.date,pm,{pid:p.id}))});
    const kindRank={bill:0,full:1,min:2,exc:3,budget:4};
    lines.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(kindRank[a.kind]-kindRank[b.kind])||(pIdx(a.item)-pIdx(b.item)));
    for(const l of lines){
      if(l.skipped)continue;
      l.short=Math.max(0,l.amount-Math.max(0,avail));avail-=l.amount;
      if(l.kind!=="bill"&&l.kind!=="budget"){
        const was=bal[l.item];bal[l.item]=Math.max(0,bal[l.item]-l.amount);l.balAfter=bal[l.item];
        if(l.kind==="min"){reg[l.item]++;l.no=reg[l.item]}
        if(was>0.5&&bal[l.item]<=0.5){const it=byId(l.item);events.push({ym,id:l.item,name:l.name,amount:l.amount,type:isPersonal(it)?"personal":"natural",freed:isPersonal(it)?0:num(it.amount)})}}}
    let draw=0,toFund=0;
    if(o.fund){
      if(avail<0&&fund>0){draw=Math.min(fund,-avail);fund-=draw;avail+=draw}
      if(avail>0){toFund=avail;fund+=avail;avail=0}
      const cd=first&&dDay(t)>num(F.day||28)?t:dateIn(ym,F.day||28);
      for(const it of queue){
        if(bal[it.id]<=0.5)continue;
        const room=fund-keep,full=bal[it.id],st=isDebt(it)?settleOf(it):0,need=st&&st<full?st:full;let x;
        if(F.mode==="chunk"&&room<need-0.5){if(room<Math.max(1,num(F.chunk)))break;x=Math.min(room,need)}
        else{if(room<need-0.5)break;x=need}
        x=Math.round(x*100)/100;fund-=x;bal[it.id]=x>=need-0.5?0:Math.max(0,full-x);
        const closed=bal[it.id]<=0.5;
        lines.push(mk(it,isGoal(it)?"goal":closed?"close":"lump",x,cd,ym,{balAfter:bal[it.id],fundAfter:fund,short:0}));
        if(closed)events.push({ym,id:it.id,name:it.name,amount:x,type:isGoal(it)?"goal":"close",freed:isDebt(it)?num(it.amount):0});
        if(!closed)break}}
    Object.keys(bal).forEach(id=>{if(bal[id]<=0.5&&!payoff[id])payoff[id]=ym});
    months.push({ym,income,open,fundOpen,lines,end:avail,toFund,draw,fund,short:sum(lines,l=>l.short||0),bal:{...bal}});

    if(k>=1&&!pending&&ym>=lastPlanned)break}
  const total={};months.forEach(m=>m.lines.forEach(l=>{if(l.kind==="min"&&l.no)total[l.item]=l.no}));

const debtFree=sim=>{const ds=S.items.filter(isDebt);if(ds.some(d=>!sim.payoff[d.id]))return null;return ds.map(d=>sim.payoff[d.id]).filter(p=>p!=="done").sort().pop()||"done"};

/* ---------- surplus: yours to decide ---------- */
const dueLeftThisMonth=noBudget=>sum((SIM.months[0]?.lines||[]).filter(l=>!l.skipped&&OBL.has(l.kind)&&!(noBudget&&l.kind==="budget")),l=>l.amount);
const surplusNow=noBudget=>Math.max(0,Math.floor(freeCash()-dueLeftThisMonth(noBudget)));
function surplusFor(ym){
  const cur=ymOf(todayStr());if(ym>=cur)return surplusNow(true);
  const end=dateIn(ym,31);
  const cashEnd=num(S.startCash)+sum(Object.keys(S.entries).filter(k=>k<=end),k=>netOf(S.entries[k]))-sum(S.payments.filter(p=>p.date<=end),p=>num(p.amount))-sum(S.reserves.filter(r=>r.date<=end),r=>r.kind==="out"?-num(r.amount):num(r.amount));
  const owed=sum((SIM.months[0]?.lines||[]).filter(l=>!l.skipped&&OBL.has(l.kind)&&l.kind!=="budget"&&l.for<=ym),l=>l.amount);
  return Math.max(0,Math.floor(Math.min(cashEnd-owed,freeCash())))}
function decisionYm(){
  const t=todayStr(),cur=ymOf(t),start0=ymOf(S.startDate);
  for(let ym=start0;ym<cur;ym=addM(ym,1))if(!S.closed[ym])return ym;
  if(dDay(t)===dim(cur)&&new Date().getHours()>=18&&!S.closed[cur])return cur;
  return null}
function closeThrough(ym){for(let m=ymOf(S.startDate);m<=ym;m=addM(m,1))S.closed[m]=true}
const fundReady=()=>{const nt=nextTarget();return nt&&fundBal()-keepAmt()>=curBal(nt)-0.5?nt:null};

/* ---------- fund advisor: compares what the fund holds with your debts, by how risky each debt is ---------- */
const RISK0={};
const RISKN={3:"عالية",2:"متوسطة",1:"منخفضة"};
const riskOf=it=>isGoal(it)?2:(+it.risk||RISK0[it.id]||2);
/* what the app knows about each debt once, so you don't re-enter it: agreement, legal notice, deadline, settlement offer */
const AGR0={},LEGAL0={},DEAD0={};
const agreedOf=it=>it.agreed!=null?!!it.agreed:(AGR0[it.id]!=null?AGR0[it.id]:num(it.amount)>0);
const legalOf=it=>it.legal!=null?!!it.legal:!!LEGAL0[it.id];
const rawDead=it=>it.deadline!==undefined?it.deadline:(DEAD0[it.id]||"");
function deadOf(it){const d=rawDead(it);if(!d)return"";if(d<todayStr()&&S.payments.some(p=>p.item===it.id&&p.date>=addDays(d,-10)))return"";return d}
const settleOf=it=>isDebt(it)&&!isPersonal(it)&&num(it.settle)>0&&num(it.settle)<curBal(it)-0.5&&(!it.settleUntil||it.settleUntil>=todayStr())?num(it.settle):0;
const effBal=it=>settleOf(it)||curBal(it);
function flags(it){const f=[agreedOf(it)?"اتفاقية أقساط":"بدون اتفاقية"];if(legalOf(it))f.push("إنذار قانوني/تحصيل");const d=deadOf(it);if(d)f.push((d<todayStr()?"فات الموعد ":"موعد نهائي ")+dLabel(d));const st=settleOf(it);if(st)f.push("عرض تسوية "+money(st));return f.join(" · ")}
/* settling: you pay the agreed amount and the rest of the balance is dropped */
function applySettle(it,payment,balBefore){const fg=Math.round((balBefore-num(payment.amount))*100)/100;if(fg<=0.5)return 0;payment.settle=fg;it.balance=num(it.balance)-fg;it.forgiven=num(it.forgiven)+fg;it.settle=null;it.settleUntil="";return fg}
/* every debt gets a score out of 100 from nine criteria; the advisor proposes the top one */
function scoreAll(room){
  const t=todayStr(),list=S.order.map(byId).filter(it=>it&&(isDebt(it)||isGoal(it))&&curBal(it)>0.5),n=list.length;
  const odBy={};(SIM.months[0]?.lines||[]).forEach(l=>{if(l.kind==="min"&&!l.skipped&&l.date<t&&!odBy[l.item])odBy[l.item]=l});
  return list.map((it,i)=>{
    const bal=curBal(it),st=settleOf(it),need=st||bal,cov=Math.min(1,room/need),r=riskOf(it),od=odBy[it.id],why=[],inst=isDebt(it)&&!isPersonal(it);
    let sc=cov*cov*25;why.push(cov>=0.999?(st?"الصندوق يكفي التسوية":"الصندوق يقفله كامل"):cov>=0.85?"الصندوق قريب يقفله ("+Math.round(cov*100)+"%)":"الصندوق يغطي "+Math.round(cov*100)+"% منه");
    sc+=(r-1)/2*15;if(isDebt(it))why.push("خطورة "+RISKN[r]);
    if(inst&&legalOf(it)){sc+=15;why.push("إنذار قانوني/تحصيل")}
    const d=inst?deadOf(it):"";if(d){const k=diffDays(t,d);sc+=k<=7?10:k<=30?6:k<=90?3:1;why.push(k<0?"فات الموعد النهائي":"موعد نهائي "+dLabel(d))}
    if(isGoal(it)){sc+=8;why.push("هدف")}
    else if(isPersonal(it)){sc+=15;why.push("دين شخصي بدون أقساط")}
    else if(od){sc+=15;why.push("قسط متأخر")}
    else if(!agreedOf(it)){sc+=12;why.push("بدون اتفاقية")}
    else why.push("اتفاقية أقساط ماشية");
    if(st){sc+=Math.min(1,(bal-st)/bal*2)*8;why.push("تسوية توفّر "+money(bal-st))}
    sc+=n>1?(1-i/(n-1))*5:5;
    const fr=inst?num(it.amount):0;if(fr>0){sc+=Math.min(1,fr/need*12)*4;why.push("يحرر "+money(fr)+" بالشهر")}
    const rate=num(it.rate);if(rate>0){sc+=Math.min(1,rate/25)*3;why.push("فائدة "+rate+"%")}
    return{it,bal,need,st,score:Math.round(sc),why,od,closable:need<=room+0.5}}).sort((x,y)=>y.score-x.score)}
function advise(){
  const fb=fundBal(),room=Math.floor(fb-keepAmt());if(room<1||!SIM)return null;

  const best=rank.filter(x=>!isPersonal(x.it)||x.closable)[0],top=rank[0],F=S.settings.fund||{};
  if(best&&best.closable){const it=best.it;return{type:"close",it,room,rank,amount:best.need,why:"أعلى دين في التقييم ("+best.score+" من 100) والصندوق يكفي "+(isGoal(it)?"له":best.st?"تسويته ("+money(best.st)+" بدل "+money(best.bal)+")":"يقفله كامل")+": "+best.why.slice(1).join("، ")+"."}}
  if(best&&best.od){const l=best.od;return{type:"overdue",it:best.it,room,rank,line:l,amount:Math.min(room,l.amount),why:"عليك قسط متأخر من "+dLabel(l.date)+" ("+best.why.join("، ")+"). غطّه من الصندوق قبل ما يتصعّد."}}
  if(best&&F.mode==="chunk"&&room>=num(F.chunk))return{type:"pay",it:best.it,room,rank,amount:Math.min(room,best.need),why:"وصل الصندوق للمبلغ اللي حددته ("+money(F.chunk)+")، وأعلى دين في التقييم: "+best.why.join("، ")+"."};
  const near=rank.filter(x=>room/x.need>=0.85)[0];
  if(near)return{type:"keep",it:near.it,room,rank,amount:0,why:"الصندوق قريب جداً يقفل "+near.it.name+": ناقصك "+money(near.need-room)+" بس ("+near.why.slice(1).join("، ")+"). خله لين يكمل وتقفله كامل."};

/* ---------- reminders for the phone: from 3 days before each payment, every 6 hours ---------- */
let lastRem="";
function pushReminders(){
  const t=todayStr(),list=[];
  SIM.months.slice(0,3).forEach(m=>m.lines.forEach(l=>{
    if(!OBL.has(l.kind)||l.kind==="budget"||l.skipped||l.amount<=0.5||diffDays(t,l.date)>35)return;
    list.push({s:toDate(addDays(l.date,-3),0).getTime(),t:l.name+" · "+money(l.amount)+" · "+(l.date<t?"متأخر من ":l.date===t?"يستحق اليوم ":"يستحق ")+dLabel(l.date)})}));
  /* daily entry: rings at 9pm, midnight and 6am until you log the day */
  const yd=addDays(t,-1);
  if(yd>=S.startDate&&!S.entries[yd])list.push({s:Date.now()-60000,m:1,t:"ما سجلت دخل ومصاريف يوم "+dLabel(yd)});
  if(!S.entries[t])list.push({s:toDate(t,21).getTime(),m:1,t:"سجّل دخل ومصاريف اليوم ("+dLabel(t)+")"});
  const need=decisionYm(),cur=ymOf(t);
  if(need&&surplusFor(need)>0)list.push({s:Date.now()-60000,t:"قرّر وين يروح فائض "+mName(need)});
  else if(!S.closed[cur]){const e=toDate(dateIn(cur,31),18);list.push({s:e.getTime(),t:"آخر يوم في الشهر: حوّل الفائض للصندوق"})}
  S.items.filter(it=>isDebt(it)&&!isPersonal(it)&&curBal(it)>0.5).forEach(it=>{const d=deadOf(it);if(d&&diffDays(t,d)<=7)list.push({s:Date.now()-60000,t:it.name+": "+(d<t?"فات الموعد النهائي ":"موعد نهائي ")+dLabel(d)});const su=settleOf(it)?it.settleUntil:"";if(su&&diffDays(t,su)<=7)list.push({s:Date.now()-60000,t:it.name+": عرض التسوية ينتهي "+dLabel(su)})});
  const fr=adviceSnoozed()?null:fundReady();if(fr)list.push({s:Date.now()-60000,t:"صندوق السداد يكفي "+(isGoal(fr)?"للهدف: ":"تقفل ")+fr.name+" ("+money(curBal(fr))+")"});
  list.sort((a,b)=>a.s-b.s);
  const json=JSON.stringify(list.slice(0,40));
  if(json!==lastRem){lastRem=json;Native.reminders(json)}}

let drill={};
function niceStep(span){for(const s of [1,2,5,10,20,50,100,200,250,500,1000,2000,2500,5000,10000,20000,25000,50000,100000])if(span/s<=5)return s;return 200000}
function svgChart(bars,o){
  const n=bars.length;if(!n)return'<div class="empty">ما فيه بيانات.</div>';
  const W=720,H=o.h||230,L=50,R=12,T=26,B=30;
  let mx=0,mn=0;
  bars.forEach(b=>{if(o.mode==="group")b.parts.forEach(p=>{mx=Math.max(mx,p.v);mn=Math.min(mn,p.v)});else{let ps=0,ng=0;b.parts.forEach(p=>{if(p.v>0)ps+=p.v;else ng+=p.v});mx=Math.max(mx,ps);mn=Math.min(mn,ng)}});
  if(mx<=0)mx=1;
  const span=mx-mn,y=v=>T+(mx-v)/span*(H-T-B),bw=(W-L-R)/n,step=niceStep(span);
  let g="";
  for(let v=Math.ceil(mn/step)*step;v<=mx+0.001;v+=step)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+shortN(v)+"</text>";
  bars.forEach((b,i)=>{
    const x0=L+i*bw,inner=Math.min(bw*.74,o.mode==="group"?96:64),xs=x0+(bw-inner)/2;let s="";
    if(o.mode==="group"){const w=inner/b.parts.length;b.parts.forEach((p,j)=>{const y1=y(Math.max(0,p.v)),y2=y(Math.min(0,p.v));if(Math.abs(p.v)<0.5)return;s+='<rect x="'+(xs+j*w+1)+'" y="'+y1+'" width="'+Math.max(1,w-2)+'" height="'+Math.max(1,y2-y1)+'" rx="2" fill="'+p.c+'"><title>'+esc(b.tip+" · "+p.n+": "+money(p.v))+"</title></rect>"})}
    else{let up=0,dn=0;b.parts.forEach(p=>{if(Math.abs(p.v)<0.5)return;let y1,y2;if(p.v>0){y1=y(up+p.v);y2=y(up);up+=p.v}else{y1=y(dn);y2=y(dn+p.v);dn+=p.v}s+='<rect x="'+xs+'" y="'+y1+'" width="'+inner+'" height="'+Math.max(1,y2-y1)+'" fill="'+p.c+'"><title>'+esc(b.tip+" · "+p.n+": "+money(p.v))+"</title></rect>"})}
    if(o.labels!==false){
      const val=o.mode==="group"?b.parts[b.parts.length-1].v:sum(b.parts,p=>p.v);
      const top=o.mode==="group"?Math.max(0,...b.parts.map(p=>p.v)):sum(b.parts.filter(p=>p.v>0),p=>p.v);
      if(Math.abs(val)>=1)s+='<text x="'+(x0+bw/2)+'" y="'+(val<0&&top<=0?y(val)+13:y(top)-6)+'" text-anchor="middle" font-size="'+(n>9?10:11.5)+'" font-weight="600" fill="'+(val<0?"var(--bad)":"var(--ink)")+'">'+shortN(val)+"</text>"}
    if(b.key)g+='<g data-a="drill" data-k="'+o.key+'" data-y="'+b.key+'"><rect x="'+x0+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent"><title>'+esc(b.tip)+" — اضغط تشوف الشهور</title></rect>"+s+"</g>";else g+=s});
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)"/>';
  const every=Math.ceil(n/(o.ticks||12));
  bars.forEach((b,i)=>{if(i%every===0)g+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="'+(n>9?10.5:12)+'" font-weight="'+(b.key?600:400)+'" fill="'+(b.key?"var(--ink)":"var(--muted)")+'">'+esc(b.label)+"</text>"});
  return '<div class="chartbox"><svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="'+esc(o.title||"")+'" style="direction:ltr">'+g+"</svg></div>"}
function drillChart(key,title,ms,partsOf,o){

  let bars;

    '<h3>أو دفعة استثنائية لدين الحين</h3><div class="fields"><div class="field"><label for="f_sd">الدين</label><select id="f_sd" name="debt"><option value="">— بدون —</option>'+debtOptions(null)+"</select></div>"+field("المبلغ","damt","")+'</div><h3>أو احتياطي ثاني</h3><div class="fields"><div class="field"><label for="f_pur">الغرض</label><select id="f_pur" name="pur">'+OTHER_PURPOSES.map(p=>"<option>"+p+"</option>").join("")+"</select></div>"+field("المبلغ","ramt","")+'</div><div class="note info" id="spLeft"></div>'+
    actionsRow("تم",'<button type="button" class="btn" data-a="fixincome" data-ym="'+(mandYm||cur)+'">الدخل فيه خطأ — صحّح</button>',!!mandYm)+"</form>",fd=>{

      S.payments.push({id:uid(),item:d.id,amount:da,date:t,note:"من الفائض",ptype:isPersonal(d)?"regular":"exceptional",fromSurplus:mandYm||cur})}
    if(fa>0)S.reserves.push({id:uid(),date:t,amount:fa,kind:"in",purpose:FUND});
    if(ra>0)S.reserves.push({id:uid(),date:t,amount:ra,kind:"in",purpose:fd.pur||"عام"});
    if(mandYm)closeThrough(mandYm);
    done(fa>0?"انضاف "+money(fa)+" لصندوق السداد":da>0?"انسجلت دفعة استثنائية · باقي "+esc(d.name)+" "+money(curBal(d)):"تجنّب "+money(ra)+" احتياطي");afterFund()},!!mandYm);

  openSheet('<h2>الدخل والصندوق</h2><form><h3>خطة الدخل</h3><div class="fields">'+field("متوسط الدخل لليوم (صافي بعد البنزين)","daily",st.dailyAvg)+field("أيام الشغل بالشهر","wd",st.workdays,"number",'min="1" max="31"')+'</div><p class="small muted" id="planM"></p>'+
    '<div class="field"><label>دخل متوقع لأشهر محددة (فاضي = الخطة)</label><div class="fields">'+months.map(m=>field(mName(m),"m_"+m,ibm[m]??"")).join("")+"</div></div>"+
    '<div class="field"><label for="f_mode">الخطة تحسب الدخل من</label><select id="f_mode" name="mode"><option value="plan"'+(st.incomeMode!=="actual"?" selected":"")+'>الخطة فوق</option><option value="actual"'+(st.incomeMode==="actual"?" selected":"")+'>متوسط يومياتي الفعلية (آخر 30 يوم)</option></select><span class="small muted">'+(a?"معدلك الفعلي ~"+money(a.month)+" بالشهر قبل الأكل"+(a.days<7?" (يحتاج 7 أيام على الأقل)":""):"ما فيه يوميات بعد")+"</span></div>"+
    '<h3>صندوق السداد</h3><div class="field"><label for="f_fm">طريقة الصندوق</label><select id="f_fm" name="fm"><option value="close"'+(F.mode!=="chunk"?" selected":"")+'>يجمع لين يقفل الدين كامل</option><option value="chunk"'+(F.mode==="chunk"?" selected":"")+">يدفع على الدين كل ما يوصل مبلغ معين</option></select></div><div class=\"fields\">"+field("المبلغ اللي يدفع عنده","chunk",F.chunk)+field("يبقى في الصندوق دائماً (طوارئ)","keep",F.keep)+field("يوم الإقفال في الشهر","fday",F.day||28,"number",'min="1" max="31"')+field("النقد يوم بداية الخطة","cash",S.startCash)+"</div>"+actionsRow()+"</form>",fd=>{
    st.dailyAvg=num(fd.daily);st.workdays=Math.min(31,Math.max(1,Math.round(num(fd.wd))||26));st.incomeMode=fd.mode;S.startCash=num(fd.cash);
    st.fund={mode:fd.fm,chunk:Math.max(100,num(fd.chunk)||2000),keep:Math.max(0,num(fd.keep)),day:Math.min(31,Math.max(1,Math.round(num(fd.fday))||28))};
    months.forEach(m=>{const v=fd["m_"+m];if(v===""||v==null)delete ibm[m];else ibm[m]=num(v)});done("انحفظت الإعدادات")});
  const f=$("#sheetRoot form"),upd=()=>{$("#planM").textContent="= "+money(num(f.daily.value)*num(f.wd.value))+" بالشهر"};f.addEventListener("input",upd);upd()}
function dayEditSheet(d){
  const e=S.entries[d];if(!e)return;
  openSheet("<h2>يومية "+dLabel(d)+" "+d.slice(0,4)+'</h2><form><div class="fields">'+field("الدخل","inc",e.inc)+field("البنزين","fuel",e.fuel)+field("الأكل والشرب","food",e.food)+field("مصاريف ثانية","other",e.other)+'</div><div class="field"><label for="f_note2">ملاحظة</label><input id="f_note2" name="note" value="'+esc(e.note||"")+'"></div>'+actionsRow("حفظ",'<button type="button" class="btn danger" id="delDay">حذف اليوم</button>')+"</form>",fd=>{S.entries[d]={inc:num(fd.inc),fuel:num(fd.fuel),food:num(fd.food),other:num(fd.other),note:fd.note||""};done("انحفظت اليومية")});
  $("#delDay").onclick=()=>confirmSheet("تحذف يومية "+dLabel(d)+"؟","حذف",()=>{delete S.entries[d];done("انحذفت اليومية")})}
function exportData(){
  const txt=JSON.stringify(S);
  try{if(Native.has("share")){AndroidBridge.share(txt);return}}catch(e){}
  openSheet('<h2>نسخة احتياطية</h2><p class="small muted">انسخ النص كامل واحفظه عندك.</p><div class="field"><textarea id="expTxt" rows="8" readonly>'+esc(txt)+'</textarea></div><div class="btns" style="justify-content:flex-end"><button class="btn" data-a="close">إغلاق</button></div>');$("#expTxt").select()}
function importData(){
  openSheet('<h2>استرجاع نسخة</h2><form><div class="field"><label for="f_imp">الصق نص النسخة الاحتياطية</label><textarea id="f_imp" name="imp" rows="8" style="direction:ltr"></textarea></div><p class="small muted">البيانات الحالية تنستبدل بالنسخة.</p>'+actionsRow("استرجاع")+"</form>",fd=>{try{const o=JSON.parse(fd.imp);if(!o.items||!o.order)throw 0;S=o;S.updatedAt=Date.now();Store.save(S);location.reload()}catch(e){toast("النص هذا مو نسخة صحيحة");return false}})}

/* ---------- routing & events ---------- */
const VIEWS={alerts:viewAlerts,home:viewHome,plan:viewPlan,day:viewDay,debts:viewDebts,reports:viewReports};
function tab(){const h=location.hash.slice(1);return VIEWS[h]?h:"home"}
let prompting=false,snooze=0;
function render(){
  SIM=simulate({fund:true});SIM0=simulate({fund:false});
  const a=avgDaily();PACE=a&&a.days>=7&&S.settings.incomeMode!=="actual"?simulate({fund:true,rate:a}):null;
  PINFO=payInfo();
  const t=tab(),res=reserveBal();$("#topCash").textContent=money(cashNow());$("#topRes").hidden=res<=0.5;$("#topResV").textContent=money(res);
  document.querySelectorAll("#tabs a").forEach(x=>{if(x.dataset.tab===t)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current")});
  ALERTS=buildAlerts();{const bn=$("#bellN"),bl=$(".top .bell");bn.hidden=!ALERTS.length;bn.textContent=ALERTS.length;if(t==="alerts")bl.setAttribute("aria-current","page");else bl.removeAttribute("aria-current")}
  lineIndex=[];$("#view").innerHTML=syncBanner()+VIEWS[t]();if(t==="day")wireDay();
  pushReminders();
  const need=decisionYm();
  if(need&&!prompting&&Date.now()>snooze&&!$("#sheetRoot .sheet")){prompting=true;setTimeout(()=>{prompting=false;if(decisionYm()&&!$("#sheetRoot .sheet"))surplusSheet(decisionYm())},250)}}
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0)});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("month")&&openMonths){if(d.open)openMonths.add(d.dataset.ym);else openMonths.delete(d.dataset.ym)}},true);
document.addEventListener("change",e=>{if(e.target.id==="repSel"){repDebt=e.target.value;render()}});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a],[data-go]");if(!el)return;
  if(el.dataset.go){location.hash=el.dataset.go;return}
  const a=el.dataset.a;
  if(a==="close"){closeSheet();return}
  if(el.closest("#sheetRoot .menu")&&a!=="report"&&a!=="closenow")return;
  switch(a){
    case"line":{const l=lineIndex[+el.dataset.i];if(l)lineSheet(l);break}
    case"paid":paidSheet(el.dataset.pid);break;
    case"report":closeSheet(true);repMode="debts";repDebt=el.dataset.id;if(location.hash!=="#reports")location.hash="reports";else render();break;
    case"closenow":closeSheet(true);closeNowSheet(el.dataset.id);break;
    case"tofund":toFundNow();break;
    case"advice":adviceSheet();break;
    case"syncsetup":syncSheet();break;
    case"viewmode":try{localStorage.setItem("sadad-view",el.dataset.v)}catch(e){}location.reload();break;
    case"syncnow":toast("جاري المزامنة...");syncNow(true);break;
    case"syncoff":SY={repo:SY.repo,token:"",last:0,err:""};saveSY();closeSheet(true);render();toast("المزامنة متوقفة على هذا الجهاز");break;
    case"alert":{const al=ALERTS[+el.dataset.i];if(al)al.go();break}
    case"settle":settleSheet(el.dataset.id);break;
    case"advlater":S.advice={bal:fundBal()};persist();closeSheet(true);toast("تمام، المبلغ باقي في الصندوق. يرجع المقترح لما يتغير الرصيد.",3500);render();break;
    case"excfull":{const f=$("#sheetRoot form"),it=f&&byId(f.item.value);if(it){f.amount.value=Math.round(curBal(it)*100)/100;f.dispatchEvent(new Event("input",{bubbles:true}))}break}
    case"drill":drill[el.dataset.k]=el.dataset.y;render();break;
    case"undrill":drill[el.dataset.k]=null;render();break;
    case"addexc":excSheet(el.dataset.ym,el.dataset.item);break;
    case"editday":dayEditSheet(el.dataset.d);break;
    case"edit":itemSheet(el.dataset.id);break;
    case"add":itemSheet(null,el.dataset.k);break;
    case"policy":policySheet();break;
    case"surplus":surplusSheet(null);break;
    case"usereserve":useReserveSheet();break;
    case"surplusnow":snooze=0;render();break;
    case"fixincome":{const ym=el.dataset.ym,cur=ymOf(todayStr());closeSheet(true);snooze=Date.now()+20*60000;repMode="income";repRange=ym===cur?"month":ym===addM(cur,-1)?"prev":"all";toast("صحّح اليوميات الغلط، وبعدها يرجع لك سؤال الفائض");if(location.hash!=="#reports")location.hash="reports";else render();break}
    case"up":case"down":{const i=S.order.indexOf(el.dataset.id),j=a==="up"?i-1:i+1;if(i<0||j<0||j>=S.order.length)break;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];persist();render();const nx=nextSig();toast((a==="up"?"تقدّم":"تأخّر")+" في الترتيب"+(nx?" · الإقفال الجاي: "+nx.name+" "+mName(nx.ym):""),3500);break}
    case"settings":settingsSheet();break;
    case"testnotify":toast(Native.test()?"وصلك تنبيه تجريبي؟ إذا لا، فعّل الإشعارات للتطبيق من الإعدادات":"التنبيهات تشتغل في التطبيق على التابلت");break;
    case"export":exportData();break;
    case"import":importData();break;
    case"reset":confirmSheet("ترجع للخطة الأصلية؟ تنحذف كل اليوميات والدفعات والتعديلات.","رجوع للأصل",()=>{S=defaultState();done("رجعت الخطة الأصلية")});break;
    case"rep":e.preventDefault();repMode=el.dataset.v;if(location.hash!=="#reports")location.hash="reports";else render();break;
    case"range":repRange=el.dataset.v;render();break}});
window.addEventListener("focus",()=>{if(!$("#sheetRoot .sheet"))render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#sheetRoot .sheet"))render()});
setInterval(()=>{if(!$("#sheetRoot .sheet")&&!document.hidden)render()},300000);
setInterval(()=>{if(!document.hidden)syncNow(false)},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow(false)});
window.addEventListener("online",()=>{render();syncNow(false)});
window.addEventListener("offline",()=>{if(!$("#sheetRoot .sheet"))render()});
migrate();PREV=recIndex(S);
render();
syncNow(false);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>

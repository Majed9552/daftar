  --good:#1E7A3D; --good-soft:#DDF0E2; --warn:#9A5B06; --warn-soft:#FBEED6; --bad:#B42318; --bad-soft:#FADFDB;
  --paid:#B8F7CB; --paid-ink:#0A5226; --paid-glow:rgb(30 200 95/.5);
  --due:#FFD3CC; --due-hot:#FFA597; --due-ink:#8E170D; --due-glow:rgb(235 45 30/.55);
  --chart-muted:#B7C3BE; --chart-good:#3FA563;
  --font:"Plex",system-ui,"Noto Sans Arabic",Tahoma,sans-serif; --display:"Kufi","Plex",system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#29352F;
  --accent:#4EC0AC; --accent-ink:#06231D; --accent-soft:#16352E;
  --good:#5BC27E; --good-soft:#15301E; --warn:#E3A94A; --warn-soft:#33270F; --bad:#F07A6C; --bad-soft:#3A1915;
  --paid:#1C6B3A; --paid-ink:#D2FFE0; --paid-glow:rgb(60 230 120/.45);
  --due:#6E1F17; --due-hot:#A12A1D; --due-ink:#FFE0DA; --due-glow:rgb(255 90 70/.55);
  --chart-muted:#43514B; --chart-good:#4FBF76; color-scheme:dark}}

<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>fmtDate(new Date());
const ymOf=s=>s.slice(0,7);
const addM=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)+k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+pad(m)};
const mBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const dateIn=(ym,day)=>ym+"-"+pad(Math.min(Math.max(1,Math.round(+day||1)),dim(ym)));
const mName=ym=>MONTHS[+ym.slice(5,7)-1]+" "+ym.slice(0,4);
const dDay=s=>+s.slice(8,10);
const dLabel=s=>(+s.slice(8,10))+" "+MONTHS[+s.slice(5,7)-1];
const toDate=(s,h=12)=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),h);
const addDays=(s,k)=>{const d=toDate(s);d.setDate(d.getDate()+k);return fmtDate(d)};
const diffDays=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const money=n=>{n=Math.round(+n||0);return (n<0?"-":"")+Math.abs(n).toLocaleString("en-US")};
const shortN=n=>{const a=Math.abs(n),s=n<0?"-":"";return s+(a>=1e4?Math.round(a/1e3)+"k":a>=1e3?(a/1e3).toFixed(1).replace(/\.0$/,"")+"k":Math.round(a))};
const M=n=>'<span class="num">'+money(n)+"</span>";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const FUND="صندوق السداد";
const APPV="2.3.1",APPN=231;
const TAX="مخصص الضريبة";

/* ---------- storage + phone features (Android bridge, browser fallback) ---------- */
const KEY="sadad-v1";
const Store={
  load(){
    try{if(window.AndroidBridge){const s=AndroidBridge.load();if(s)return JSON.parse(s)}}catch(e){}
    try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
    return null},
  save(st){
    const s=JSON.stringify(st);let ok=false;
    try{if(window.AndroidBridge){AndroidBridge.save(s);ok=true}}catch(e){}
    try{localStorage.setItem(KEY,s);ok=true}catch(e){}
    return ok}
};
const Native={
  has:k=>{try{return !!(window.AndroidBridge&&AndroidBridge[k])}catch(e){return false}},
  reminders(json){try{if(Native.has("setReminders"))AndroidBridge.setReminders(json)}catch(e){}},
  test(){try{if(Native.has("testNotify")){AndroidBridge.testNotify();return true}}catch(e){}return false}
};

/* ---------- starting plan (the numbers from our conversation) ---------- */
const LIVING={id:"living",kind:"bill",name:"المعيشة: أكل وشرب",amount:500,day:28,freq:"monthly",start:"2000-01",end:null,fromDaily:true};
const REPAIR={id:"goal1",kind:"goal",name:"هدف",target:0};
const RATE0={};
/* cards sent to collections: interest is frozen, so none is added */
const FROZEN0={};
const TAX0={pct:0,start:""};
const SAVE0=[];
function defaultState(){return{
  v:5,startDate:todayStr(),startCash:0,
  settings:{dailyAvg:200,workdays:26,incomeByMonth:{},incomeMode:"plan",fund:{mode:"close",chunk:2000,keep:500,day:28}},
  items:[],order:[],overrides:{},entries:{},payments:[],planned:[],reserves:[],closed:{}
}}

/* a plan update: a small description of changes (new agreements, dates, amounts) applied once on top of the saved data */
function applySpec(sp){
  if(!sp)return false;if(sp.sadadCode||sp.sadadPlan)sp.sadadUpdate=sp.sadadCode||sp.sadadPlan;
  if(num(sp.need)>APPN){toast("هذا الكود يحتاج إصدار أحدث من التطبيق. حدّث التطبيق أول",6000);return false}
  if(!sp.sadadUpdate||S.ref===sp.sadadUpdate)return false;
  const g=id=>S.items.find(i=>i.id===id);
  (sp.items||[]).forEach(o=>{const d=g(o.id);if(!d)return;
    if(o.clr)Object.keys(S.overrides).forEach(k=>{if(k.startsWith(o.id+"|"))delete S.overrides[k]});
    if(o.cur!=null)d.balance=Math.round((num(o.cur)+paidBy(d.id))*100)/100;
    if(o.unpaid&&paidIn(d.id,o.unpaid.ym)<1)d.start=o.unpaid.start;
    Object.assign(d,o.set||{})});
  Object.keys(sp.ov||{}).forEach(k=>{if(g(k.split("|")[0]))S.overrides[k]=sp.ov[k]});
  (sp.add||[]).forEach(x=>{const e=g(x.id);if(e)Object.assign(e,x);else{S.items.push(x);if(x.kind!=="bill")S.order.push(x.id)}});
  S.contacts=S.contacts||[];(sp.contacts||[]).forEach(c=>{if(!g(c.item))return;const e=S.contacts.find(x=>x.id===c.id);if(!e)S.contacts.push(c);else if(num(c.rev)>num(e.rev))Object.assign(e,c)});
  if(sp.delContacts)S.contacts=S.contacts.filter(c=>!sp.delContacts.includes(c.id));
  (sp.extras||[]).forEach(x=>{S.extras=extras();if(!S.extras.some(y=>y.id===x.id))S.extras.push(x)});
  if(sp.delPlanned)S.planned=S.planned.filter(y=>!sp.delPlanned.includes(y.id));
  (sp.planned||[]).forEach(x=>{if(!g(x.item))return;const e=S.planned.find(y=>y.id===x.id);if(e)Object.assign(e,x);else S.planned.push(x)});
  if(sp.rules)S.rules=sp.rules;
  S.ref=sp.sadadUpdate;return true}
const REF=null;
function applyRef(){return applySpec(REF)}

let S=Store.load();
if(!S||!S.items){S=defaultState();Store.save(S)}
/* updates for plans saved by an earlier version: saved days, payments and reserves stay */
function migrate(){
  if(!S.v||S.v<4){S.settings=S.settings||{};S.planned=S.planned||[];S.reserves=S.reserves||[];S.closed=S.closed||{}}
  if(S.v<5){
    S.items.forEach(it=>{if(it.kind!=="debt")return;if(it.risk==null)it.risk=riskOf(it);if(it.dtype!=="personal"){if(it.agreed==null)it.agreed=agreedOf(it);if(it.legal==null)it.legal=legalOf(it);if(it.deadline===undefined)it.deadline=rawDead(it)}});
    S.v=5}
  if(S.v<6){
    /* interest rates start as estimates until you correct them from your statements */
    S.items.forEach(it=>{if(it.kind==="debt"&&it.dtype!=="personal"&&!(num(it.rate)>0)&&RATE0[it.id]){it.rate=RATE0[it.id];it.rateEst=true}});
    if(!S.settings.tax)S.settings.tax={...TAX0};
    S.contacts=S.contacts||[];S.adjusts=S.adjusts||[];
    SAVE0.forEach(g=>{if(!S.items.some(i=>i.id===g.id)){S.items.push({...g});S.order.push(g.id)}});
    S.v=6}
  if(S.v<7){S.items.forEach(it=>{if(FROZEN0[it.id]&&it.rateEst){it.rate=null;it.rateEst=false}});S.v=7}
  Store.save(S)}
/* every record remembers when it last changed (or was deleted), so two devices that worked apart can be merged without losing either side */
let PREV={};
const recObjs=st=>{const m={};Object.keys(st.entries||{}).forEach(k=>m["e:"+k]=st.entries[k]);(st.payments||[]).forEach(x=>m["p:"+x.id]=x);(st.planned||[]).forEach(x=>m["pl:"+x.id]=x);(st.reserves||[]).forEach(x=>m["r:"+x.id]=x);(st.items||[]).forEach(x=>m["i:"+x.id]=x);(st.contacts||[]).forEach(x=>m["c:"+x.id]=x);(st.extras||[]).forEach(x=>m["x:"+x.id]=x);(st.adjusts||[]).forEach(x=>m["a:"+x.id]=x);return m};
const recIndex=st=>{const o=recObjs(st),m={};Object.keys(o).forEach(k=>m[k]=JSON.stringify(o[k]));return m};
function stampChanges(){
  const now=Date.now(),cur=recIndex(S);S.stamp=S.stamp||{};S.tomb=S.tomb||{};
  Object.keys(cur).forEach(k=>{if(PREV[k]!==cur[k]){S.stamp[k]=now;delete S.tomb[k]}});
  Object.keys(PREV).forEach(k=>{if(!(k in cur)){S.tomb[k]=now;delete S.stamp[k]}});
  PREV=cur}
const canon=o=>o===null||typeof o!=="object"?JSON.stringify(o):Array.isArray(o)?"["+o.map(canon).join(",")+"]":"{"+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}";
function mergeStates(L,R){
  const lu=num(L.updatedAt),ru=num(R.updatedAt),newer=ru>=lu?R:L,older=newer===R?L:R,out=JSON.parse(JSON.stringify(newer));
  const ls=L.stamp||{},rs=R.stamp||{},tomb={};[L.tomb||{},R.tomb||{}].forEach(t=>Object.keys(t).forEach(k=>tomb[k]=Math.max(tomb[k]||0,num(t[k]))));
  const li=recObjs(L),ri=recObjs(R),stamp={},keep={};
  new Set(Object.keys(li).concat(Object.keys(ri))).forEach(k=>{
    const a=li[k],b=ri[k],sa=a?num(ls[k]):-1,sb=b?num(rs[k]):-1;let pick,st;
    if(a&&b){if(sa>sb){pick=a;st=sa}else if(sb>sa){pick=b;st=sb}else{pick=newer===R?b:a;st=sa}}
    else if(a){pick=a;st=sa}else{pick=b;st=sb}
    if(num(tomb[k])>st)return;
    delete tomb[k];keep[k]=pick;if(st>0)stamp[k]=st});
  out.entries={};Object.keys(keep).filter(k=>k.startsWith("e:")).sort().forEach(k=>out.entries[k.slice(2)]=keep[k]);
  const arr=(pre,name)=>{const seen=new Set(),res=[];(newer[name]||[]).concat(older[name]||[]).forEach(x=>{const k=pre+x.id;if(keep[k]&&!seen.has(k)){seen.add(k);res.push(keep[k])}});return res};
  out.payments=arr("p:","payments");out.planned=arr("pl:","planned");out.reserves=arr("r:","reserves");out.items=arr("i:","items");out.contacts=arr("c:","contacts");out.extras=arr("x:","extras");out.adjusts=arr("a:","adjusts");
  const ids=new Set(out.items.filter(i=>i.kind==="debt"||i.kind==="goal").map(i=>i.id));
  out.order=(out.order||[]).filter(id=>ids.has(id));ids.forEach(id=>{if(!out.order.includes(id))out.order.push(id)});
  out.closed=Object.assign({},older.closed||{},newer.closed||{});
  out.ref=[L.ref||"",R.ref||""].sort().pop();out.rules=newer.rules||older.rules||[];
  /* the side that already carries the newer reference framework keeps its month-by-month schedule */
  {const hi=(L.ref||"")>(R.ref||"")?L:(R.ref||"")>(L.ref||"")?R:null;if(hi){out.overrides=JSON.parse(JSON.stringify(hi.overrides||{}));out.rules=hi.rules||[]}}
  out.stamp=stamp;out.tomb=tomb;out.updatedAt=Math.max(lu,ru);return out}
/* a copy of your data is kept on this device for each of the last 7 days */
const SNAP="sadad-snap-";let snapAt=0;
function snapKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(SNAP))ks.push(k)}}catch(e){}return ks.sort()}
function snapSave(){const k=SNAP+todayStr();try{if(Date.now()-snapAt<600000&&localStorage.getItem(k))return;localStorage.setItem(k,JSON.stringify(S));snapAt=Date.now();snapKeys().slice(0,-7).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function persist(){snapSave();S.updatedAt=Date.now();stampChanges();if(!Store.save(S))toast("ما قدرت أحفظ — جرّب مرة ثانية");queueSync()}

/* ---------- sync between your devices through your own private GitHub repo ---------- */
const SYNCKEY="sadad-sync";
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNCKEY)||"null")}catch(e){return null}})()||{repo:"",token:"",last:0,err:""};
const saveSY=()=>{try{localStorage.setItem(SYNCKEY,JSON.stringify(SY))}catch(e){}};
const syncOn=()=>!!(SY.token&&SY.repo);
const b64e=x=>btoa(unescape(encodeURIComponent(x))),b64d=x=>decodeURIComponent(escape(atob(String(x).replace(/\s/g,""))));
const ghFile=(method,body)=>fetch("https://api.github.com/repos/"+SY.repo+"/contents/data.json"+(method==="GET"?"?t="+Date.now():""),{method,cache:"no-store",headers:{Authorization:"Bearer "+SY.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
async function ghRead(){const r=await ghFile("GET");if(r.status===404)return null;if(r.status===401||r.status===403)throw new Error("الرمز غير صحيح أو ما له صلاحية على المستودع");if(!r.ok)throw new Error("خطأ "+r.status);const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))}}
async function ghWrite(sha){const body={message:"sync",content:b64e(JSON.stringify(S))};if(sha)body.sha=sha;const r=await ghFile("PUT",body);if(r.status===404)throw new Error("المستودع غير موجود أو الرمز ما له صلاحية كتابة");if(!r.ok)throw new Error(r.status===409||r.status===422?"الجهاز الثاني حفظ قبلك، أعيد المحاولة":"خطأ رفع "+r.status)}
function applyRemote(data){S=data;Store.save(S);migrate();PREV=recIndex(S);if(applyRef())persist();render()}
function syncBanner(){
  if(!syncOn())return"";
  const pending=num(S.updatedAt)>num(SY.last);
  if(navigator.onLine===false)return '<div class="note warn"><b>بدون إنترنت.</b> وصّل الإنترنت عشان تتزامن البيانات مع جهازك الثاني. اشتغل عادي: كل تعديلاتك محفوظة على هذا الجهاز'+(pending?"، وتنرفع كاملة أول ما يتصل":"")+".</div>";
  if(SY.err)return '<div class="note bad">المزامنة ما تمت: '+esc(SY.err)+'. تعديلاتك محفوظة على هذا الجهاز. <a href="#debts" style="color:inherit;font-weight:600">إعدادات المزامنة</a></div>';
  return""}
let syncBusy=false,syncT=null;
function queueSync(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),1500)}
async function syncNow(manual){
  if(!syncOn()||syncBusy)return;
  if(navigator.onLine===false){if(manual)toast("بدون إنترنت. تعديلاتك محفوظة وتنرفع أول ما يتصل.",3500);return}
  syncBusy=true;let msg="";
  try{
    const r=await ghRead();
    if(!r){await ghWrite(null);msg="انرفعت بياناتك"}
    else{
      const before=canon(S),m=mergeStates(S,r.data),cm=canon(m),pull=cm!==before,push=cm!==canon(r.data);
      if(pull){if($("#sheetRoot .sheet")){syncBusy=false;queueSync();return}applyRemote(m)}
      if(push){S.updatedAt=Date.now();Store.save(S);await ghWrite(r.sha)}
      msg=pull&&push?"اندمجت تعديلات الجهازين":pull?"تحدّثت البيانات من الجهاز الثاني":push?"انرفعت آخر تعديلاتك":"البيانات متطابقة"}
    SY.last=Date.now();SY.err=""}
  catch(e){SY.err=String(e&&e.message||e);msg="المزامنة ما تمت: "+SY.err}
  syncBusy=false;saveSY();
  if(manual)toast(msg,3500);
  if(tab()==="debts"&&!$("#sheetRoot .sheet")){const el=$("#syncStatus");if(el)el.textContent=syncStatusText()}}
const syncStatusText=()=>!syncOn()?"غير مفعّلة. بياناتك على هذا الجهاز فقط.":SY.err?"آخر محاولة فشلت: "+SY.err:SY.last?"آخر مزامنة: "+new Date(SY.last).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" · "+fmtDate(new Date(SY.last)):"مفعّلة، بانتظار أول مزامنة";
function syncSheet(){
  openSheet('<h2>المزامنة بين الأجهزة</h2><p class="small muted">بياناتك تنحفظ في مستودع خاص (Private) في حسابك على GitHub، وكل جهاز تحط فيه نفس الرمز يشوف نفس الأرصدة. تدخلها مرة وحدة في كل جهاز.</p><form><div class="field"><label for="f_repo">المستودع الخاص (اسم الحساب/اسم المستودع)</label><input id="f_repo" name="repo" style="direction:ltr" placeholder="username/sadad-data" value="'+esc(SY.repo)+'"></div><div class="field"><label for="f_tok">رمز الوصول (Token)</label><input id="f_tok" name="token" type="password" style="direction:ltr" autocomplete="off" value="'+esc(SY.token)+'"></div>'+actionsRow("ربط ومزامنة",syncOn()?'<button type="button" class="btn danger" data-a="syncoff">إيقاف المزامنة</button>':"")+"</form>",fd=>{
    const repo=fd.repo.trim().replace(/^https:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),token=fd.token.trim();
    if(!/^[^\/\s]+\/[^\/\s]+$/.test(repo)||!token){toast("اكتب المستودع بصيغة الحساب/المستودع، والرمز");return false}
    SY={repo,token,last:0,err:""};toast("جاري الربط...");
    ghRead().then(()=>{saveSY();closeSheet(true);render();return syncNow(true)})
    .catch(e=>{SY.token="";toast("ما تم الربط: "+String(e.message||e),6000)});
    return false})}

/* ---------- money in and out ---------- */
const byId=id=>S.items.find(i=>i.id===id);
const isDebt=it=>!!it&&it.kind==="debt";
const isPersonal=it=>isDebt(it)&&it.dtype==="personal";
const isGoal=it=>!!it&&it.kind==="goal";
const inQueue=it=>isGoal(it)||(isDebt(it)&&!isPersonal(it));
const isSave=it=>isGoal(it)&&!!it.save;
const goalLeft=g=>Math.max(0,num(g.target)-(g.save?resOf("save:"+g.id):paidBy(g.id)));
const purposeName=k=>{if(String(k).startsWith("save:")){const g=byId(k.slice(5));return "ادخار: "+(g?g.name:"هدف محذوف")}return k};
/* money leaves the payoff fund: to a debt or a one-off goal as a payment, or into a savings pot that stays yours */
function fundPay(it,x,d,extra){
  S.reserves.push({id:uid(),date:d,amount:x,kind:"out",purpose:FUND,note:it.name});
  if(isSave(it)){S.reserves.push({id:uid(),date:d,amount:x,kind:"in",purpose:"save:"+it.id});return null}
  const pay=Object.assign({id:uid(),item:it.id,amount:x,date:d,note:"من صندوق السداد",ptype:"exceptional",closeFund:true},extra||{});S.payments.push(pay);return pay}
const netOf=e=>num(e.inc)-num(e.fuel)-num(e.food)-num(e.other);
const forYm=p=>p.for||ymOf(p.date);
const livingItem=()=>S.items.find(i=>i.fromDaily);
const livingActive=ym=>{const l=livingItem();return !!l&&billActive(l,ym)};
const foodIn=ym=>sum(Object.keys(S.entries).filter(k=>ymOf(k)===ym),k=>num(S.entries[k].food));
const paidBy=id=>sum(S.payments.filter(p=>p.item===id),p=>num(p.amount));
const paidIn=(id,ym)=>{const it=byId(id);return sum(S.payments.filter(p=>p.item===id&&p.ptype!=="exceptional"&&forYm(p)===ym),p=>num(p.amount))+(it&&it.fromDaily?foodIn(ym):0)};
const curBal=it=>isGoal(it)?goalLeft(it):Math.max(0,num(it.balance)-paidBy(it.id));
const origOf=it=>isGoal(it)?num(it.target):num(it.balance);
/* one-off money that is not taxi income (a cheque, a refund): expected until you mark it received or refused */
const extras=()=>S.extras||[];
const extraGot=()=>sum(extras().filter(x=>x.status==="ok"),x=>num(x.amount));
const extraDue=ym=>sum(extras().filter(x=>(x.status||"pending")==="pending"&&(ymOf(x.date)===ym||(x.date<todayStr()&&ym===ymOf(todayStr())))),x=>num(x.amount));
const cashNow=()=>num(S.startCash)+sum(Object.values(S.entries),netOf)+extraGot()-sum(S.payments,p=>num(p.amount));
const resOf=p=>sum(S.reserves.filter(r=>(r.purpose||"عام")===p),r=>r.kind==="out"?-num(r.amount):num(r.amount));
const reserveBal=()=>sum(S.reserves,r=>r.kind==="out"?-num(r.amount):num(r.amount));
const fundBal=()=>resOf(FUND);
const keepAmt=()=>num((S.settings.fund||{}).keep);
function reserveByPurpose(){const o={};S.reserves.forEach(r=>{const k=r.purpose||"عام";o[k]=(o[k]||0)+(r.kind==="out"?-1:1)*num(r.amount)});Object.keys(o).forEach(k=>{if(Math.abs(o[k])<0.5)delete o[k]});return o}
const freeCash=()=>cashNow()-reserveBal();
const ovOf=(id,ym)=>S.overrides[id+"|"+ym];
function billActive(b,ym){
  if(b.start&&ym<b.start)return false;
  if(b.end&&ym>b.end)return false;
  if(b.freq==="once")return ym===(b.start||ym);
  if(b.freq==="bimonthly")return mBetween(b.start||ym,ym)%2===0;
  if(b.freq==="yearly")return mBetween(b.start||ym,ym)%12===0;
  return true}
function defaultPlanned(it,ym){

/* ---------- reminders for the phone: from 3 days before each payment, every 6 hours ---------- */
let lastRem="";
function pushReminders(){
  const t=todayStr(),list=[];
  SIM.months.slice(0,3).forEach(m=>m.lines.forEach(l=>{
    if(!OBL.has(l.kind)||l.kind==="budget"||l.skipped||l.amount<=0.5||diffDays(t,l.date)>35)return;
    list.push({s:toDate(addDays(l.date,-3),0).getTime(),t:l.name+" · "+money(l.amount)+" · "+(l.date<t?"متأخر من ":l.date===t?"يستحق اليوم ":"يستحق ")+dLabel(l.date)})}));
  /* daily entry: rings at 9pm, midnight and 6am until you log the day */
  const yd=addDays(t,-1);
  if(yd>=S.startDate&&!S.entries[yd])list.push({s:Date.now()-60000,m:1,t:"ما سجلت دخل ومصاريف يوم "+dLabel(yd)});
  if(!S.entries[t])list.push({s:toDate(t,21).getTime(),m:1,t:"سجّل دخل ومصاريف اليوم ("+dLabel(t)+")"});
  const need=decisionYm(),cur=ymOf(t);
  if(need&&surplusFor(need)>0)list.push({s:Date.now()-60000,t:"قرّر وين يروح فائض "+mName(need)});
  else if(!S.closed[cur]&&!autoOn("fund")){const e=toDate(dateIn(cur,31),18);list.push({s:e.getTime(),t:"آخر يوم في الشهر: حوّل الفائض للصندوق"})}
  S.items.filter(it=>isDebt(it)&&!isPersonal(it)&&curBal(it)>0.5).forEach(it=>{const d=deadOf(it);if(d&&diffDays(t,d)<=7)list.push({s:Date.now()-60000,t:it.name+": "+(d<t?"فات الموعد النهائي ":"موعد نهائي ")+dLabel(d)});const su=settleOf(it)?it.settleUntil:"";if(su&&diffDays(t,su)<=7)list.push({s:Date.now()-60000,t:it.name+": عرض التسوية ينتهي "+dLabel(su)})});
  (S.contacts||[]).forEach(c=>{const d=byId(c.item);if(c.next&&d&&curBal(d)>0.5&&diffDays(t,c.next)<=1)list.push({s:toDate(c.next,9).getTime(),t:"تابع مع "+d.name+(c.res==="settle"?" (عرض التسوية)":"")})});
  S.items.filter(d=>isDebt(d)&&d.call&&curBal(d)>0.5).forEach(d=>{const ym=ymOf(t),cd=dateIn(ym,d.call.day);if(diffDays(t,cd)<=2&&cd>=addDays(t,-5)&&plannedFor(d,ym)-paidIn(d.id,ym)>0.5&&!(S.contacts||[]).some(c=>c.item===d.id&&c.date>=addDays(cd,-3)&&ymOf(c.date)===ym))list.push({s:toDate(cd,9).getTime(),t:"اتصل بـ "+d.call.who+" قبل دفعة "+d.name})});
  S.items.filter(d=>isDebt(d)&&d.critical&&curBal(d)>0.5).forEach(d=>{const l=(SIM.months[0].lines||[]).concat((SIM.months[1]||{lines:[]}).lines).find(x=>x.item===d.id&&x.kind==="min"&&!x.skipped&&x.amount>0.5);if(l&&diffDays(t,l.date)<=7&&diffDays(t,l.date)>3)list.push({s:toDate(addDays(l.date,-7),9).getTime(),t:"حرج: "+d.name+" "+money(l.amount)+" يوم "+dLabel(l.date)+" · لا تفوّتها"})});
  const fr=adviceSnoozed()?null:fundReady();if(fr)list.push({s:Date.now()-60000,t:"صندوق السداد يكفي "+(isGoal(fr)?"للهدف: ":"تقفل ")+fr.name+" ("+money(curBal(fr))+")"});
  list.sort((a,b)=>a.s-b.s);
  const json=JSON.stringify(list.slice(0,40));
  if(json!==lastRem){lastRem=json;Native.reminders(json)}}

function svgChart(bars,o){

  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)"/>';

const DAYN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function incomeStats(){
  const ks=Object.keys(S.entries).sort(),w=ks.filter(k=>num(S.entries[k].inc)>0);

    case"reset":confirmSheet("ترجع للخطة الأصلية؟ تنحذف كل اليوميات والدفعات والتعديلات.","رجوع للأصل",()=>{S=defaultState();migrate();applyRef();done("رجعت الخطة الأصلية")});break;
    case"rep":e.preventDefault();repMode=el.dataset.v;if(location.hash!=="#reports")location.hash="reports";else render();break;
    case"range":repRange=el.dataset.v;render();break}});
window.addEventListener("focus",()=>{if(!$("#sheetRoot .sheet"))render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#sheetRoot .sheet"))render()});
setInterval(()=>{if(!$("#sheetRoot .sheet")&&!document.hidden)render()},300000);
setInterval(()=>{if(!document.hidden)syncNow(false)},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow(false)});
window.addEventListener("online",()=>{render();syncNow(false)});
window.addEventListener("offline",()=>{if(!$("#sheetRoot .sheet"))render()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>120000)lockNow()});
const P0=recIndex(S);migrate();
/* the new framework is stamped as a fresh change so it wins when the two devices merge */
if(applyRef()){PREV=P0;persist()}else PREV=recIndex(S);
lockNow();
render();
syncNow(false);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
